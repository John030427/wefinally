<!DOCTYPE html>

  <link rel="icon" href="data:," />
  <style>

    .layout { display: flex; min-height: 100vh; }

    .member-detail-item { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: .5rem; align-items: start; padding: .45rem .55rem; background: #fafafa; border-radius: 6px; }

    .service-topbar { min-height: 72px; padding: .8rem 1rem; border-bottom: 1px solid var(--svc-line); background: rgba(250,248,243,.96); display: grid; grid-template-columns: minmax(240px, 1fr) auto; gap: 1rem; align-items: center; }
    .service-search { position: relative; max-width: 640px; }
    .service-search input { width: 100%; border: 1px solid var(--svc-line); background: #fffdfa; color: var(--svc-ink); border-radius: 8px; padding: .7rem .85rem; font-size: .875rem; outline: none; }
    .service-search input:focus { border-color: var(--svc-green); box-shadow: 0 0 0 3px rgba(47,107,87,.1); }

    .service-metric span { color: #716d66; font-size: .7rem; }
    .service-columns { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(420px, 1fr) 360px; }

    .service-mode { border: 1px solid var(--svc-line); background: #fffdfa; color: #625e57; border-radius: 6px; padding: .45rem .5rem; font-size: .75rem; cursor: pointer; }
    .service-mode.active { background: var(--svc-ink); border-color: var(--svc-ink); color: #fff; }
    .service-readonly { border-top: 1px solid var(--svc-line); background: #f0ebe2; color: #625e57; padding: .65rem 1rem; font-size: .72rem; }
    .service-filter { white-space: nowrap; border: 1px solid var(--svc-line); background: transparent; color: #625e57; border-radius: 999px; padding: .3rem .55rem; font-size: .72rem; cursor: pointer; }

    .service-ticket-line { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .service-ticket-ref { font: 600 .75rem/1.2 "IBM Plex Mono", "JetBrains Mono", monospace; }

    .service-priority.p0 { color: var(--svc-red); background: #fff1ef; }

    .service-ticket-meta { display: flex; justify-content: space-between; gap: .5rem; color: #817b71; font-size: .68rem; }
    .service-sla.overdue { color: var(--svc-red); font-weight: 600; }
    .service-conversation { min-width: 0; background: #fffdfa; display: flex; flex-direction: column; }
    .service-conversation-head { min-height: 76px; border-bottom: 1px solid var(--svc-line); padding: .85rem 1rem; display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
    .service-conversation-title { font: 600 .92rem/1.2 "IBM Plex Mono", "JetBrains Mono", monospace; }
    .service-conversation-sub { margin-top: .3rem; color: #756f66; font-size: .72rem; }
    .service-status { display: inline-flex; align-items: center; border-radius: 999px; padding: .25rem .5rem; background: #eef5f1; color: var(--svc-green); font-size: .7rem; }

    .service-messages { flex: 1; min-height: 300px; overflow-y: auto; padding: 1rem clamp(1rem, 4vw, 3.5rem); background-image: linear-gradient(rgba(47,107,87,.035) 1px, transparent 1px); background-size: 100% 32px; }
    .service-message { display: flex; margin-bottom: .85rem; }
    .service-message.user { justify-content: flex-start; }
    .service-message.agent, .service-message.human_agent { justify-content: flex-end; }
    .service-message.system { justify-content: center; }
    .service-bubble { max-width: min(76%, 620px); border: 1px solid var(--svc-line); background: #fff; padding: .65rem .75rem; border-radius: 4px 14px 14px 14px; box-shadow: 0 4px 14px rgba(46,48,43,.05); }
    .service-message.agent .service-bubble { background: #edf4ef; border-color: #cddbd2; border-radius: 14px 4px 14px 14px; }
    .service-message.human_agent .service-bubble { background: var(--svc-ink); border-color: var(--svc-ink); color: #fff; border-radius: 14px 4px 14px 14px; }
    .service-message.system .service-bubble { border: 0; box-shadow: none; background: #eeeae3; color: #6e685f; border-radius: 999px; font-size: .72rem; }
    .service-message-label { margin-bottom: .28rem; color: #827b70; font-size: .65rem; }

    .service-message-content { white-space: pre-wrap; word-break: break-word; font-size: .84rem; line-height: 1.65; }
    .service-composer { border-top: 1px solid var(--svc-line); background: #faf8f3; padding: .75rem 1rem; }
    .service-composer textarea { width: 100%; resize: vertical; min-height: 74px; max-height: 180px; border: 1px solid var(--svc-line); border-radius: 8px; background: #fff; color: var(--svc-ink); padding: .7rem .8rem; font: .84rem/1.55 "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .service-composer textarea:focus { outline: none; border-color: var(--svc-green); box-shadow: 0 0 0 3px rgba(47,107,87,.1); }
    .service-composer-actions { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-top: .55rem; }
    .service-composer-actions small { color: #79736a; font-size: .68rem; }
    .service-action-group { display: flex; gap: .45rem; }
    .service-btn { border: 1px solid var(--svc-line); background: #fff; color: var(--svc-ink); border-radius: 6px; padding: .45rem .75rem; cursor: pointer; font-size: .76rem; }
    .service-btn.primary { background: var(--svc-green); border-color: var(--svc-green); color: #fff; }
    .service-btn.danger { color: var(--svc-red); border-color: #dfb4ad; }
    .service-btn:disabled { opacity: .5; cursor: not-allowed; }
    .service-context-section { padding: .9rem 1rem; border-bottom: 1px solid var(--svc-line); }
    .service-context-section h4 { margin-bottom: .65rem; color: #555149; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    .service-context-grid { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: .5rem .7rem; font-size: .76rem; }
    .service-context-grid dt { color: #837c72; }
    .service-context-grid dd { min-width: 0; color: var(--svc-ink); word-break: break-word; font-family: "IBM Plex Mono", "JetBrains Mono", monospace; }
    .service-summary { padding: .7rem; background: #f0ebe2; border-left: 3px solid var(--svc-orange); color: #3f423d; font-size: .78rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .service-event { display: grid; grid-template-columns: 1fr auto; gap: .25rem .5rem; padding: .45rem 0; border-bottom: 1px dashed var(--svc-line); font-size: .72rem; }
    .service-event:last-child { border-bottom: 0; }
    .service-event span:last-child { color: #7e776d; font-family: "IBM Plex Mono", "JetBrains Mono", monospace; }
    .service-empty-pane { min-height: 280px; display: grid; place-items: center; padding: 2rem; color: #817b72; text-align: center; font-size: .82rem; }
    .partner-workspace { --partner-paper:#fff9f7; --partner-ink:#242126; --partner-green:#2f7d62; margin:-1.25rem; padding:1.25rem; min-height:calc(100vh - 54px); background:var(--partner-paper); color:var(--partner-ink); font-family:"IBM Plex Sans SC","Microsoft YaHei",sans-serif; }

    .partner-head h2 { font-size:1.15rem; margin-bottom:.25rem; } .partner-head p,.partner-panel p { color:#766e70; font-size:.75rem; line-height:1.6; }
    .partner-tabs { display:flex; gap:.4rem; flex-wrap:wrap; } .partner-tab { border:1px solid #dfd4d1; background:#fff; color:#554d50; border-radius:999px; padding:.45rem .8rem; cursor:pointer; font-size:.76rem; } .partner-tab.active { background:var(--partner-ink); border-color:var(--partner-ink); color:#fff; }
    .partner-grid { display:grid; grid-template-columns:220px minmax(0,1fr); gap:1rem; align-items:start; } .partner-rail { position:sticky; top:0; display:grid; gap:.75rem; }
    .partner-panel,.partner-table { background:#fff; border:1px solid #e6deda; border-radius:10px; } .partner-panel { padding:.9rem; } .partner-panel h3 { font-size:.82rem; margin-bottom:.6rem; }
    .partner-panel input,.partner-panel textarea { width:100%; border:1px solid #dfd4d1; border-radius:6px; padding:.5rem .6rem; margin-bottom:.5rem; font-size:.78rem; } .partner-table { overflow:auto; } .partner-table table { min-width:760px; }
    .partner-code { font-family:"IBM Plex Mono","JetBrains Mono",monospace; font-weight:600; } .partner-state { display:inline-flex; border:1px solid currentColor; border-radius:999px; padding:.12rem .45rem; font-size:.68rem; } .partner-state.ok { color:var(--partner-green); background:#eef7f2; } .partner-state.wait { color:#a36f1c; background:#fff7e7; } .partner-state.stop { color:#b6403a; background:#fff1ef; }
    @media (max-width:900px) { .partner-head,.partner-grid { grid-template-columns:1fr; } .partner-rail { position:static; } }

<body>
  <div id="loginPage" class="login-wrap">
    <div class="login-card">
      <h1>WeFinally 超级管理后台</h1>
      <p>系统管理员专用 · 与用户/合伙人完全隔离</p>

        <button class="nav-item" data-p="users">用户管理</button>

  <script>
(function () {

  async function api(path, opt) {
    opt = opt || {};
    const h = { 'Content-Type': 'application/json' };
    if (token()) h['Authorization'] = 'Bearer ' + token();
    const r = await fetch(API + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
    const j = await r.json().catch(() => ({ code: -1, message: '解析失败' }));
    if (j.code === 401) { clearToken(); showLogin(); throw new Error(j.message || '未登录'); }
    if (j.code !== 0) throw new Error(j.message || '失败');
    return j.data;
  }

  async function memberApi(path, opt) {
    if (!CLOUD_MEMBER_API) return api(path, opt);
    opt = opt || {};
    const h = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cloudToken() };
    const r = await fetch(CLOUD_MEMBER_API + '/api' + path, { method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined });
    const j = await r.json().catch(() => ({ code: -1, message: '云端审核接口解析失败' }));
    if (j.code === 401) { clearToken(); showLogin(); throw new Error(j.message || '云端登录已过期'); }
    if (CLOUD_ONLY && j.code === 404) throw new Error('云端 api 版本较旧，尚未包含当前后台所需接口');
    if (j.code !== 0) throw new Error(j.message || '云端审核接口失败');
    return j.data;
  }

  function inRange(dateStr, range) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    const now = new Date();
    const start = new Date(now);
    start.setHours(0, 0, 0, 0);
    if (range === 'today') return d >= start;
    if (range === 'yesterday') { const y = new Date(start); y.setDate(y.getDate() - 1); return d >= y && d < start; }
    if (range === '7d') { const w = new Date(start); w.setDate(w.getDate() - 7); return d >= w; }
    if (range === '30d') { const m = new Date(start); m.setDate(m.getDate() - 30); return d >= m; }
    return true;
  }

  function serviceDateValue(value) {
    if (!value) return null;
    const raw = value && typeof value === 'object' && value.$date !== undefined ? value.$date : value;
    const date = new Date(typeof raw === 'string' && /^\d+$/.test(raw) ? Number(raw) : raw);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function serviceTimeText(value) {
    const date = serviceDateValue(value);
    if (!date) return '-';
    return date.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
  }

  function serviceStatusText(value) {
    return ({ open:'待领取', assigned:'已分配', processing:'处理中', waiting_user:'等待用户', waiting_system:'等待系统', resolved:'已解决', closed:'已关闭', reopened:'重新打开' })[value] || value || '待处理';
  }

  function serviceCategoryText(value) {
    return ({ privacy:'隐私投诉', payment:'支付争议', refund:'退款', user_request:'请求人工', safety:'安全风险', match:'匹配申诉', date_coordination:'约会协调', general:'一般问题' })[value] || value || '一般问题';
  }

  function servicePriorityClass(priority) {
    const normalized = String(priority || 'P2').toLowerCase();
    return ['p0', 'p1', 'p2'].includes(normalized) ? normalized : 'p2';
  }

  function serviceSlaInfo(ticket) {
    if (ticket.status === 'closed') return { text:'已关闭', overdue:false };
    if (ticket.last_reply_at || ['processing', 'waiting_user', 'waiting_system', 'resolved'].includes(ticket.status)) {
      return { text:'已首响', overdue:false };
    }
    const created = serviceDateValue(ticket.create_time);
    if (!created) return { text:'待响应', overdue:false };
    const targetMinutes = String(ticket.priority).toUpperCase() === 'P0' ? 5 : (String(ticket.priority).toUpperCase() === 'P1' ? 15 : 120);
    const remaining = targetMinutes - Math.floor((Date.now() - created.getTime()) / 60000);
    if (remaining < 0) return { text:'超时 ' + Math.abs(remaining) + ' 分钟', overdue:true };
    return { text:'剩余 ' + remaining + ' 分钟', overdue:false };
  }

  function visibleServiceTickets() {
    const query = serviceQuery.trim().toLowerCase();
    return serviceTickets.filter(ticket => {
      const statusMatch = serviceFilter === 'all'
        || (serviceFilter === 'active' && ticket.status !== 'closed')
        || ticket.status === serviceFilter
        || (serviceFilter === 'urgent' && ['P0', 'P1'].includes(String(ticket.priority).toUpperCase()));
      const haystack = [ticket.ticket_ref, ticket.user_ref, ticket.summary, ticket.category, serviceCategoryText(ticket.category), ticket.status, serviceStatusText(ticket.status)].join(' ').toLowerCase();
      return statusMatch && (!query || haystack.includes(query));
    });
  }

  window.searchCloudConversations = async function () {
    const input = document.getElementById('serviceAuditSearch');
    serviceAuditQuery = String(input?.value ?? serviceAuditQuery).trim();
    const params = new URLSearchParams();
    if (serviceIncludeTest) params.set('include_test', '1');
    if (/^WF-D-/i.test(serviceAuditQuery)) params.set('coordination_ref', serviceAuditQuery);
    else if (/^WF-U-/i.test(serviceAuditQuery)) params.set('user_ref', serviceAuditQuery);
    else if (/^WF-S-/i.test(serviceAuditQuery)) params.set('session_ref', serviceAuditQuery);
    else if (serviceAuditQuery) params.set('query', serviceAuditQuery);
    try {
      const data = await memberApi('/admin/agent/conversations' + (params.toString() ? '?' + params.toString() : ''));
      serviceConversations = data.list || [];
      serviceSelectedConversationId = serviceConversations[0]?.id || 0;
      serviceConversationDetail = null;
      renderCloudServiceWorkbench();
      if (serviceSelectedConversationId) await loadCloudConversation(serviceSelectedConversationId);
    } catch (e) { toast(e.message || '会话查询失败', false); }
  };

      title: document.getElementById('cloudKTitle').value,
      content: document.getElementById('cloudKContent').value,
      tags: document.getElementById('cloudKTags').value.split(',').map(v => v.trim()).filter(Boolean)
    };
    try {
      await memberApi('/admin/knowledge-articles' + (id ? '/' + id : ''), { method:id ? 'PUT' : 'POST', body });
      closeM(); toast('知识草稿已保存', true); pgKnowledge();
    } catch (e) { toast(e.message, false); }
  };
  window.publishCloudKnowledge = async function (id) {
    try { await memberApi('/admin/knowledge-articles/' + id + '/publish', { method:'POST' }); toast('知识已发布', true); pgKnowledge(); } catch (e) { toast(e.message, false); }
  };
  window.offlineCloudKnowledge = async function (id) {
    try { await memberApi('/admin/knowledge-articles/' + id + '/offline', { method:'POST' }); toast('知识已下线', true); pgKnowledge(); } catch (e) { toast(e.message, false); }
  };

  window.addK = function () {
    modal('新增知识库',
      '<div class="form-group"><label>问题</label><input id="kq" /></div><div class="form-group"><label>回答</label><textarea id="ka" rows="4"></textarea></div><div class="form-group"><label>关键词</label><input id="kkw" placeholder="逗号分隔" /></div>',
      '<button class="btn btn-outline" onclick="closeM()">取消</button><button class="btn btn-primary" onclick="saveK()">保存</button>');
  };

  window.editK = async function (id) {
    const rows = await api('/admin/knowledge');
    const k = rows.find(x => x.id === id);
    if (!k) return;
    modal('编辑 #' + id,
      '<div class="form-group"><label>问题</label><input id="kq" value="' + esc(k.question) + '" /></div><div class="form-group"><label>回答</label><textarea id="ka" rows="4">' + esc(k.answer) + '</textarea></div><div class="form-group"><label>关键词</label><input id="kkw" value="' + esc(k.keywords || '') + '" /></div><div class="form-group"><label>状态</label><select id="kst"><option value="1">启用</option><option value="0">禁用</option></select></div>',
      '<button class="btn btn-outline" onclick="closeM()">取消</button><button class="btn btn-primary" onclick="saveK(' + id + ')">保存</button>');
    document.getElementById('kst').value = k.status;
  };

  window.saveK = async function (id) {
    const body = { question: document.getElementById('kq').value, answer: document.getElementById('ka').value, keywords: document.getElementById('kkw')?.value, status: document.getElementById('kst') ? Number(document.getElementById('kst').value) : 1 };
    try {
      if (id) await api('/admin/knowledge/' + id, { method: 'PUT', body });
      else await api('/admin/knowledge', { method: 'POST', body });
      closeM(); toast('已保存', true); pgKnowledge();
    } catch (e) { toast(e.message, false); }
  };

  window.delK = async function (id) {
    if (!confirm('确认删除？')) return;
    try { await api('/admin/knowledge/' + id, { method: 'DELETE' }); toast('已删除', true); pgKnowledge(); } catch (e) { toast(e.message, false); }
  };

  async function pgChat() {
    const sessions = await api('/admin/chat/sessions');
    let html = sessions.length ? sessions.map(s =>
      '<tr><td>' + s.id + '</td><td>' + esc(s.nickname) + '</td><td>' + esc(s.phone || '-') + '</td><td>人工</td><td>' + esc(s.updated_at) + '</td><td><button class="btn btn-sm btn-outline" onclick="replyChat(' + s.id + ')">回复</button></td></tr>'
    ).join('') : '<tr><td colspan="6" class="empty">暂无人工会话</td></tr>';
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="card-hd"><strong>人工客服会话</strong></div><div class="card-bd"><table><thead><tr><th>会话ID</th><th>用户</th><th>手机</th><th>模式</th><th>更新时间</th><th>操作</th></tr></thead><tbody>' + html + '</tbody></table></div></div>' +
      '<p style="font-size:.8125rem;color:var(--muted)">完整 AI 对话日志存储于 ai_chat_log / chat_messages 表，可通过数据库导出。</p>';
  }

  window.replyChat = function (sid) {
    modal('回复会话 #' + sid,
      '<div class="form-group"><textarea id="replyContent" rows="4" placeholder="输入回复内容"></textarea></div>',
      '<button class="btn btn-outline" onclick="closeM()">取消</button><button class="btn btn-primary" onclick="sendReply(' + sid + ')">发送</button>');
  };
  window.sendReply = async function (sid) {
    try {
      await api('/admin/chat/reply', { method: 'POST', body: { session_id: sid, content: document.getElementById('replyContent').value } });
      closeM(); toast('已回复', true);
      if (page === 'service') pgService();
      else if (page === 'chat') pgChat();
    } catch (e) { toast(e.message, false); }
  };

  async function pgHandoff() {
    const rows = await api('/admin/handoff/tickets');
    let html = rows.length ? rows.map(t => {
      const status = encodeURIComponent(t.status || 'submitted');
      const note = encodeURIComponent(t.service_note || '');
      return '<tr><td>' + t.id + '</td><td>' + t.match_log_id + '</td><td>' + esc(t.user_openid || t.user_id) + '</td><td>' + esc(t.match_user_openid || t.match_user_id) + '</td><td>' + esc(t.status_text || t.status) + '</td><td>' + esc(t.service_note || '-') + '</td><td>' + esc(t.update_time || '') + '</td><td><button class="btn btn-sm btn-outline" onclick="editHandoff(' + t.id + ',\'' + status + '\',\'' + note + '\')">处理</button> <button class="btn btn-sm btn-outline" onclick="replyChat(' + t.user_id + ')">回复申请人</button></td></tr>';
    }).join('') : '<tr><td colspan="8" class="empty">暂无奔现工单</td></tr>';
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="card-hd"><strong>官方奔现对接工单</strong></div><div class="card-bd"><table><thead><tr><th>工单ID</th><th>匹配ID</th><th>申请人</th><th>匹配对象</th><th>状态</th><th>客服备注</th><th>更新时间</th><th>操作</th></tr></thead><tbody>' + html + '</tbody></table></div></div>' +
      '<p style="font-size:.8125rem;color:var(--muted)">PRD要求用户间无私聊；工单仅供平台客服分别确认双方意向。</p>';
  }

  window.editHandoff = function (id, status, note) {
    modal('处理奔现工单 #' + id,
      '<div class="form-group"><label>状态</label><select id="handoffStatus"><option value="submitted">已提交</option><option value="processing">客服处理中</option><option value="waiting_partner">等待对方确认</option><option value="arranged">已安排</option><option value="closed">已关闭</option></select></div><div class="form-group"><label>客服备注</label><textarea id="handoffNote" rows="4"></textarea></div>',
      '<button class="btn btn-outline" onclick="closeM()">取消</button><button class="btn btn-primary" onclick="saveHandoff(' + id + ')">保存</button>');
    document.getElementById('handoffStatus').value = decodeURIComponent(status || 'submitted');
    document.getElementById('handoffNote').value = decodeURIComponent(note || '');
  };
  window.saveHandoff = async function (id) {
    try {
      await api('/admin/handoff/tickets/' + id, {
        method: 'PUT',
        body: {
          status: document.getElementById('handoffStatus').value,
          service_note: document.getElementById('handoffNote').value
        }
      });
      closeM(); toast('已更新', true);
      if (page === 'service') pgService();
      else pgHandoff();
    } catch (e) { toast(e.message, false); }
  };

  async function pgPrivacy() {
    const data = await api('/admin/users?pageSize=20');
    let rows = '';
    for (const u of data.list.slice(0, 10)) {
      try {
        const d = await api('/admin/users/' + u.id);
        const ag = (d.agreements || []).map(a => a.agreement_type).join(', ') || '无记录';
        rows += '<tr><td>' + u.id + '</td><td>' + esc(u.nickname) + '</td><td>' + esc(ag) + '</td><td>' + esc(u.created_at) + '</td></tr>';
      } catch (e) {}
    }
    if (!rows) rows = '<tr><td colspan="4" class="empty">暂无</td></tr>';
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="card-hd"><strong>用户协议授权记录（抽样）</strong></div><div class="card-bd"><table><thead><tr><th>用户ID</th><th>昵称</th><th>已授权协议</th><th>注册时间</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
      '<p style="font-size:.8125rem;color:var(--muted)">完整合规日志见 user_agreements / user_privacy_auth_log 表。</p>';
  }

  async function pgWhitelist() {
    const [batches, whitelist] = await Promise.all([
      api('/admin/whitelist/batches'),
      api('/admin/whitelist')
    ]);
    const batchRows = batches.list && batches.list.length ? batches.list.map(b =>
      '<tr><td>' + b.id + '</td><td>' + esc(sourceText(b.source)) + '</td><td>' + esc(b.unit || '-') + '</td><td>' + b.received_count + '</td><td>' + b.imported_count + '</td><td>' + esc(b.create_time || '-') + '</td></tr>'
    ).join('') : '<tr><td colspan="6" class="empty">暂无导入批次</td></tr>';
    const listRows = whitelist.list && whitelist.list.length ? whitelist.list.map(w =>
      '<tr><td>' + w.id + '</td><td>' + esc(w.phone_masked || '-') + '</td><td>' + esc(w.name || '-') + '</td><td>' + esc(w.unit || '-') + '</td><td>' + esc(sourceText(w.source)) + '</td><td>' + (w.used ? '<span class="badge b-ok">已领取</span>' : '<span class="badge b-pending">未领取</span>') + '</td><td>' + esc(w.create_time || '-') + '</td></tr>'
    ).join('') : '<tr><td colspan="7" class="empty">暂无白名单</td></tr>';
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="card-hd"><strong>单位白名单导入</strong><button class="btn btn-sm btn-outline" onclick="pgWhitelist()">刷新</button></div><div class="card-bd">' +
      '<p style="font-size:.8125rem;color:var(--muted);margin-bottom:.75rem">对外口径：单位白名单导入，用户首次微信登录后用登记手机号激活权益；后台仅脱敏展示手机号。</p>' +
      '<div class="form-group"><label>导入 JSON</label><textarea id="wlJson" rows="5" placeholder=\'[{"phone":"13800009991","name":"张三","unit":"深圳某单位","source":"public"}]\'></textarea></div>' +
      '<button class="btn btn-primary" onclick="importWhitelist()">导入白名单</button>' +
      '</div></div>' +
      '<div class="card"><div class="card-hd"><strong>导入批次</strong></div><div class="card-bd"><table><thead><tr><th>ID</th><th>来源</th><th>单位</th><th>接收</th><th>导入</th><th>时间</th></tr></thead><tbody>' + batchRows + '</tbody></table></div></div>' +
      '<div class="card"><div class="card-hd"><strong>白名单脱敏列表</strong></div><div class="card-bd"><table><thead><tr><th>ID</th><th>手机号</th><th>姓名</th><th>单位</th><th>来源</th><th>状态</th><th>创建时间</th></tr></thead><tbody>' + listRows + '</tbody></table></div></div>';
  }
  window.pgWhitelist = pgWhitelist;

  window.importWhitelist = async function () {
    try {
      const raw = document.getElementById('wlJson').value.trim();
      const parsed = JSON.parse(raw || '[]');
      const list = Array.isArray(parsed) ? parsed : [parsed];
      const result = await api('/admin/whitelist/import', { method: 'POST', body: { list } });
      toast('已导入 ' + result.imported + ' 条，批次 #' + result.batch_id, true);
      pgWhitelist();
    } catch (e) {
      toast(e.message || '导入失败', false);
    }
  };

  function pgExport() {
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="card-hd"><strong>数据导出 (CSV)</strong></div><div class="card-bd" style="display:flex;gap:.75rem;flex-wrap:wrap">' +
      '<a class="btn btn-primary" href="' + API + '/admin/export/users" target="_blank" onclick="return dl(event,\'users\')">导出用户</a>' +
      '<a class="btn btn-primary" href="' + API + '/admin/export/orders" target="_blank" onclick="return dl(event,\'orders\')">导出订单</a>' +
      '<a class="btn btn-primary" href="' + API + '/admin/export/partners" target="_blank" onclick="return dl(event,\'partners\')">导出合伙人</a>' +
      '</div></div>';
  }
  window.dl = function (e, type) {
    e.preventDefault();
    fetch(API + '/admin/export/' + type, { headers: { Authorization: 'Bearer ' + token() } })
      .then(r => r.blob()).then(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = type + '.csv';
        a.click();
        toast('导出成功', true);
      }).catch(() => toast('导出失败', false));
    return false;
  };

  async function pgLogs() {
    const health = await api('/common/health');
    document.getElementById('content').innerHTML =
      '<div class="card"><div class="card-hd"><strong>系统状态</strong><button class="btn btn-sm btn-outline" onclick="pgLogs()">刷新</button></div><div class="card-bd">' +
      '<p>服务状态：<span class="badge b-ok">' + esc(health.status) + '</span></p>' +
      '<p style="margin-top:.5rem">服务器时间：' + esc(health.time) + '</p>' +
      '<p style="margin-top:.5rem;font-size:.8125rem;color:var(--muted)">详细运行日志请查看服务器 PM2 / 宝塔面板日志文件。</p></div></div>';
  }

  function pag(cur, total, id) {
    return '<div class="pagination">第 ' + cur + ' / ' + total + ' 页 <button class="btn btn-sm btn-outline" onclick="goPg(\'' + id + '\',' + (cur - 1) + ')">上一页</button><button class="btn btn-sm btn-outline" onclick="goPg(\'' + id + '\',' + (cur + 1) + ')">下一页</button><input type="hidden" id="' + id + '" value="' + cur + '" /></div>';
  }
  window.goPg = function (id, p) { if (p < 1) return; document.getElementById(id).value = p; if (page === 'users') pgUsers(); else if (page === 'matches') pgMatches(); };

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.classList.add('hidden');
    btn.disabled = true;
    try {
      const credentials = { username: document.getElementById('loginUser').value.trim(), password: document.getElementById('loginPass').value };
      const d = await api('/auth/admin-login', { method: 'POST', body: credentials });
      if (CLOUD_ONLY) {
        setCloudToken(d.token);
      } else if (CLOUD_MEMBER_API) {
        const cloudRes = await fetch(CLOUD_MEMBER_API + '/api/auth/admin-login', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(credentials) });
        const cloudJson = await cloudRes.json();
        if (cloudJson.code !== 0) throw new Error(cloudJson.message || '云端会员审核登录失败');
        setCloudToken(cloudJson.data.token);
      }
      setToken(d.token);
      setAdminRole(d.admin.role || d.admin.admin_role || 'super_admin');
      document.getElementById('adminName').textContent = d.admin.username + ' · ' + roleText(adminRole());
      showApp(); navTo(defaultPage()); toast('登录成功', true);
    } catch (ex) { err.textContent = ex.message; err.classList.remove('hidden'); }
    finally { btn.disabled = false; }
  });

  document.getElementById('logoutBtn').addEventListener('click', function () { clearToken(); showLogin(); });
  document.getElementById('nav').addEventListener('click', function (e) { const b = e.target.closest('.nav-item'); if (b) navTo(b.dataset.p); });

  if (CLOUD_ONLY) {
    document.querySelector('.login-card p').textContent = 'CloudBase 真实环境 · 管理员专用';
  }

  if (token()) {
    document.getElementById('adminName').textContent = (CLOUD_ONLY ? 'CloudBase · ' : '') + roleText(adminRole());
    showApp(); navTo(defaultPage());
  } else showLogin();
})();
  </script>
</body>
</html>
