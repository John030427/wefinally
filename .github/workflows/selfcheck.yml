name: Selfchecks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: selfcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcheck:
    name: WeFinally selfchecks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            miniprogram/cloudfunctions/api/package-lock.json
            miniprogram/cloudfunctions/agent-graph/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server --ignore-scripts

      - name: Install API cloud function dependencies
        run: npm ci --prefix miniprogram/cloudfunctions/api --ignore-scripts

      - name: Install agent-graph dependencies
        run: npm ci --prefix miniprogram/cloudfunctions/agent-graph --ignore-scripts

      - name: Release workflow contract
        run: node server/selfcheck/release-workflow-contract.js

      - name: WeChat identity boundary
        run: npm --prefix server run selfcheck:wx-identity

      - name: QA pair reset checks
        run: npm --prefix server run selfcheck:qa-pair-reset

      - name: Agent-graph build and unit tests
        run: npm --prefix miniprogram/cloudfunctions/agent-graph run check

      - name: Flexible date location checks
        run: npm --prefix server run selfcheck:flexible-date-location

      - name: Agent checks
        run: npm --prefix server run selfcheck:agent

      - name: Safety checks
        run: npm --prefix server run selfcheck:safety

      - name: AI report checks
        run: npm --prefix server run selfcheck:ai-report

      - name: Cloud payment checks
        run: npm --prefix server run selfcheck:cloudpay

      - name: Member checks
        run: npm --prefix server run selfcheck:member

      - name: Cloud match checks
        run: npm --prefix server run selfcheck:cloud-match

      - name: Mini program UI contract checks
        run: npm --prefix server run selfcheck:secondary-identity && npm --prefix server run selfcheck:custom-tab-bar
